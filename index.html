<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftNice - Sweet Gifty Case</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121216;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* O'ng yuqori burchakdagi balans */
        .balance-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1e1e28;
            border: 2px solid #2a2a3b;
            padding: 10px 18px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 16px;
            font-weight: bold;
        }

        .balance-box img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .balance-box span {
            color: #00e5ff;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .case-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 160px;
            background: #1a1a24;
            border-top: 2px solid #2a2a3b;
            border-bottom: 2px solid #2a2a3b;
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .pointer {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #3b82f6;
            z-index: 10;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #3b82f6;
        }

        .pointer::before, .pointer::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
        }
        .pointer::before {
            top: 0;
            border-top: 10px solid #3b82f6;
        }
        .pointer::after {
            bottom: 0;
            border-bottom: 10px solid #3b82f6;
        }

        .case-track {
            display: flex;
            position: absolute;
            left: 0;
            will-change: transform;
        }

        .case-item {
            min-width: 120px;
            height: 130px;
            background: #232333;
            border: 2px solid #32324a;
            border-radius: 12px;
            margin: 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .case-item img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            margin-bottom: 6px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .case-item .name {
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
        }

        .case-item .value {
            font-size: 12px;
            color: #00e5ff;
            margin-top: 2px;
            font-weight: bold;
        }

        .roll-btn {
            margin-top: 30px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: 0.2s;
            text-transform: uppercase;
        }

        .roll-btn:hover {
            transform: scale(1.03);
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        .roll-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #fbbf24;
            height: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- O'ng yuqori burchakdagi balans (Olmos rasmi ham yonida turibdi deb faraz qilamiz, yoki xohlasangiz uni ham o'zgartirishingiz mumkin) -->
    <div class="balance-box">
        <img src="olmos.png" alt="Olmos" onerror="this.src='https://t.me/i/emoji/d/5472251105941018442.png'">
        <span id="balance">0.0</span>
    </div>

    <div class="header">Sweet Gifty Case</div>

    <div class="case-container" id="container">
        <div class="pointer"></div>
        <div class="case-track" id="track"></div>
    </div>

    <button class="roll-btn" id="rollBtn" onclick="startRoll()">ROLL</button>
    <div id="result"></div>

    <script>
        let userBalance = 0.0;
        const balanceSpan = document.getElementById('balance');

        // index.html bilan bir papkada turgan lokal fayllarga moslashtirildi
        const giftTemplates = [
            { name: "💎 Olmos", amount: 0.5, img: "olmos.png" },
            { name: "💎 Olmos", amount: 0.1, img: "olmos.png" },
            { name: "Champagne", amount: 0, img: "champagne.png" },
            { name: "Gift Box", amount: 0, img: "giftbox.png" },
            { name: "Ayiq", amount: 0, img: "Ayiq.png" } // Bear / Ayiq rasmi ulandi
        ];

        const track = document.getElementById('track');
        const rollBtn = document.getElementById('rollBtn');
        const resultDiv = document.getElementById('result');
        const container = document.getElementById('container');

        const itemWidth = 136; 
        const totalItems = 70;  
        let itemsData = [];

        function buildTrack() {
            track.innerHTML = '';
            itemsData = [];
            for (let i = 0; i < totalItems; i++) {
                let selectedItem;
                let rand = Math.random();
                if (rand < 0.65) { 
                    selectedItem = Math.random() < 0.5 ? giftTemplates[0] : giftTemplates[1];
                } else {
                    const otherItems = giftTemplates.slice(2);
                    selectedItem = otherItems[Math.floor(Math.random() * otherItems.length)];
                }

                itemsData.push(selectedItem);

                const div = document.createElement('div');
                div.className = 'case-item';
                div.innerHTML = `
                    <img src="${selectedItem.img}" alt="${selectedItem.name}">
                    <div class="name">${selectedItem.name}</div>
                    <div class="value">${selectedItem.amount > 0 ? '+' + selectedItem.amount : ''}</div>
                `;
                track.appendChild(div);
            }
        }

        buildTrack();
        track.style.transform = `translateX(0px)`;

        let isRolling = false;

        function startRoll() {
            if (isRolling) return;
            isRolling = true;
            rollBtn.disabled = true;
            resultDiv.innerText = "";

            track.style.transition = 'none';
            track.style.transform = `translateX(0px)`;
            buildTrack(); 

            setTimeout(() => {
                const containerWidth = container.offsetWidth;
                const targetIndex = 50;
                const exactCenterOffset = (targetIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2);
                
                const randomShift = (Math.random() - 0.5) * 120;
                const roughStopPosition = exactCenterOffset + randomShift;

                track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.2, 1)';
                track.style.transform = `translateX(${-roughStopPosition}px)`;

                setTimeout(() => {
                    const currentPos = roughStopPosition;
                    let landedIndex = Math.round((currentPos + (containerWidth / 2) - (itemWidth / 2)) / itemWidth);
                    
                    if (landedIndex < 0) landedIndex = 0;
                    if (landedIndex >= totalItems) landedIndex = totalItems - 1;

                    const correctedX = -((landedIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2));

                    track.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
                    track.style.transform = `translateX(${correctedX}px)`;

                    setTimeout(() => {
                        isRolling = false;
                        rollBtn.disabled = false;
                        
                        const winningItem = itemsData[landedIndex];

                        if (winningItem.amount > 0) {
                            userBalance = parseFloat((userBalance + winningItem.amount).toFixed(1));
                            balanceSpan.innerText = userBalance;
                            resultDiv.innerText = `Tabriklaymiz! Siz yutdingiz: ${winningItem.name} (+${winningItem.amount})`;
                        } else {
                            resultDiv.innerText = `Afsus, sovg'a chiqdi! Yana urinib ko'ring.`;
                        }
                    }, 650);

                }, 4050);

            }, 50);
        }
    </script>
</body>
</html>
