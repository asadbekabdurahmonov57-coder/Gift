<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Code & Text Clipboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { mono: ['Fira Code', 'Consolas', 'Monaco', 'monospace'] }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-gray-800 bg-gray-950 py-4 px-6 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up"></i> Live Cloud Clipboard
      </h1>
      <span class="text-xs bg-green-900/60 text-green-400 border border-green-700 py-1 px-3 rounded-full flex items-center gap-1">
        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Online Sync
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto w-full p-4 md:p-6 flex-grow flex flex-col gap-6">

    <!-- Yangi matn tashlash -->
    <section class="bg-gray-800 border border-gray-700 rounded-xl p-4 md:p-6 shadow-lg">
      <h2 class="text-lg font-semibold mb-3 text-gray-200">Matn yoki Kod Tashlash</h2>
      
      <div class="mb-4">
        <input 
          type="text" 
          id="snippetTitle" 
          placeholder="Sarlavha (ixtiyoriy, masalan: Python kodi)..." 
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-gray-100 placeholder-gray-500 mb-3"
        >
        <textarea 
          id="snippetContent" 
          rows="5" 
          placeholder="Bu yerga matn yoki kodni joylang..." 
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm font-mono focus:outline-none focus:border-blue-500 text-gray-100 placeholder-gray-500 resize-y"
        ></textarea>
      </div>

      <div class="flex justify-end gap-3">
        <button onclick="clearInput()" class="px-4 py-2 text-sm bg-gray-700 hover:bg-gray-600 rounded-lg text-gray-300 transition-all">
          Tozalash
        </button>
        <button id="saveBtn" onclick="saveSnippet()" class="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-all flex items-center gap-2 shadow-md">
          <i class="fa-solid fa-paper-plane"></i> Bulutga Saqlash
        </button>
      </div>
    </section>

    <!-- Saqlangan matnlar -->
    <section class="flex flex-col gap-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold text-gray-200">Bulutdagi Matnlar</h2>
        <span id="loadingStatus" class="text-xs text-gray-400">Yuklanmoqda...</span>
      </div>

      <div id="snippetsContainer" class="flex flex-col gap-4">
        <!-- Bulutdan kelgan ma'lumotlar shu yerda chiqadi -->
      </div>
    </section>

  </main>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Sozlamalari (Bepul tayyor test ma'lumotlar bazasi)
    const firebaseConfig = {
      databaseURL: "https://clipboard-sync-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const snippetsRef = ref(db, 'snippets');

    // Realtime ko'rsatish (Har safar ma'lumot o'zgarganda avto yangilanadi)
    onValue(snippetsRef, (snapshot) => {
      const container = document.getElementById('snippetsContainer');
      document.getElementById('loadingStatus').innerText = "Jonli sinxronlangan";
      container.innerHTML = '';

      const data = snapshot.val();
      if (!data) {
        container.innerHTML = `
          <div class="text-center py-10 bg-gray-800/40 rounded-xl border border-dashed border-gray-700 text-gray-400">
            Bulutda hozircha matn yo'q. Telefondan yoki kompyuterdan matn tashlang!
          </div>
        `;
        return;
      }

      // Kalitlarni massivga aylantirib, eng yangilarini tepaga chiqarish
      const items = Object.entries(data).reverse();

      items.forEach(([key, item]) => {
        const card = document.createElement('div');
        card.className = "bg-gray-800 border border-gray-700 rounded-xl overflow-hidden shadow-md";

        card.innerHTML = `
          <div class="bg-gray-850 px-4 py-3 border-b border-gray-700 flex justify-between items-center bg-gray-900/50">
            <span class="font-medium text-sm text-blue-300 truncate max-w-[70%]">
              ${escapeHtml(item.title || 'Sarlavhasiz matn')}
            </span>
            <div class="flex items-center gap-2">
              <button 
                onclick="copyText('${key}', this)" 
                class="px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white text-xs rounded-md transition-all flex items-center gap-1 font-medium shadow">
                <i class="fa-regular fa-copy"></i> Nusxalash
              </button>
              <button 
                onclick="deleteSnippet('${key}')" 
                class="p-1.5 text-gray-400 hover:text-red-400 rounded-md transition-colors">
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>
          <div class="p-4 bg-gray-950 overflow-x-auto">
            <pre class="font-mono text-xs md:text-sm text-green-400 whitespace-pre leading-relaxed"><code id="code-${key}">${escapeHtml(item.content)}</code></pre>
          </div>
        `;

        container.appendChild(card);
      });
    });

    // Saqlash funksiyasi
    window.saveSnippet = function() {
      const titleInput = document.getElementById('snippetTitle');
      const contentInput = document.getElementById('snippetContent');

      const title = titleInput.value.trim();
      const content = contentInput.value;

      if (!content.trim()) {
        alert("Matn yoki kod kiriting!");
        return;
      }

      push(snippetsRef, {
        title: title,
        content: content,
        timestamp: Date.now()
      }).then(() => {
        titleInput.value = '';
        contentInput.value = '';
      });
    };

    // Nusxalash funksiyasi
    window.copyText = function(key, btn) {
      const codeElement = document.getElementById(`code-${key}`);
      const textToCopy = codeElement.innerText;

      navigator.clipboard.writeText(textToCopy).then(() => {
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-check"></i> Nusxalandi!`;
        btn.classList.remove('bg-green-600', 'hover:bg-green-500');
        btn.classList.add('bg-blue-600');

        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.classList.remove('bg-blue-600');
          btn.classList.add('bg-green-600', 'hover:bg-green-500');
        }, 2000);
      });
    };

    // O'chirish funksiyasi
    window.deleteSnippet = function(key) {
      if (confirm("O'chirilsinmi?")) {
        remove(ref(db, `snippets/${key}`));
      }
    };

    window.clearInput = function() {
      document.getElementById('snippetTitle').value = '';
      document.getElementById('snippetContent').value = '';
    };

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
