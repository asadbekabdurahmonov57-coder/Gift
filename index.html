<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftNice - Sweet Gifty Case</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121216;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* Top-right balance box */
        .balance-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1e1e28;
            border: 2px solid #2a2a3b;
            padding: 10px 18px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 16px;
            font-weight: bold;
            z-index: 20;
        }

        .balance-box img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .balance-box span {
            color: #00e5ff;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 1px;
            z-index: 20;
        }

        .case-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 160px;
            background: #1a1a24;
            border-top: 2px solid #2a2a3b;
            border-bottom: 2px solid #2a2a3b;
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* Cho'g'lar (Sparks/Embers) animatsiyasi uchun konteyner */
        .embers-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1; /* Baraban ichida, elementlar ostida */
        }

        .ember {
            position: absolute;
            bottom: -10px;
            background: radial-gradient(circle, #ffcc00 0%, #ff3b00 100%);
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 0 0 6px #ff5500;
            animation: riseUp linear infinite;
        }

        @keyframes riseUp {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-180px) translateX(var(--rand-x)) scale(0.3);
                opacity: 0;
            }
        }

        .pointer {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #3b82f6;
            z-index: 15;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #3b82f6;
        }

        .pointer::before, .pointer::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
        }
        .pointer::before {
            top: 0;
            border-top: 10px solid #3b82f6;
        }
        .pointer::after {
            bottom: 0;
            border-bottom: 10px solid #3b82f6;
        }

        .case-track {
            display: flex;
            position: absolute;
            left: 0;
            will-change: transform;
            z-index: 5;
        }

        .case-item {
            min-width: 120px;
            height: 130px;
            background: #232333;
            border: 2px solid #32324a;
            border-radius: 12px;
            margin: 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .case-item img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            margin-bottom: 6px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .case-item .name {
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
        }

        .case-item .value {
            font-size: 12px;
            color: #00e5ff;
            margin-top: 2px;
            font-weight: bold;
        }

        .roll-btn {
            margin-top: 30px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: 0.2s;
            text-transform: uppercase;
            z-index: 20;
        }

        .roll-btn:hover {
            transform: scale(1.03);
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        .roll-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #fbbf24;
            height: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Top-right balance box -->
    <div class="balance-box">
        <img src="Usdt.png" alt="USDT" onerror="this.src='https://t.me/i/emoji/d/5472251105941018442.png'">
        <span id="balance">0.0</span>
    </div>

    <div class="header">Sweet Gifty Case</div>

    <div class="case-container" id="container">
        <!-- Cho'g'lar chiqib turadigan fon qismi -->
        <div class="embers-container" id="embers"></div>
        <div class="pointer"></div>
        <div class="case-track" id="track"></div>
    </div>

    <button class="roll-btn" id="rollBtn" onclick="startRoll()">ROLL</button>
    <div id="result"></div>

    <script>
        let userBalance = 0.0;
        const balanceSpan = document.getElementById('balance');

        const giftTemplates = [
            { name: "USDT", amount: 0.5, img: "Usdt.png" },
            { name: "USDT", amount: 0.1, img: "Usdt.png" },
            { name: "Champagne", amount: 0, img: "Shampan.png" },
            { name: "Gift Box", amount: 0, img: "podarka.png" },
            { name: "Bear", amount: 0, img: "Ayiq.png" }
        ];

        const track = document.getElementById('track');
        const rollBtn = document.getElementById('rollBtn');
        const resultDiv = document.getElementById('result');
        const container = document.getElementById('container');
        const embersContainer = document.getElementById('embers');

        // Mayda cho'g'larni yaratish funksiyasi
        function createEmbers() {
            embersContainer.innerHTML = '';
            const emberCount = 25; // Cho'g'lar soni
            for (let i = 0; i < emberCount; i++) {
                const ember = document.createElement('div');
                ember.className = 'ember';
                
                const size = Math.random() * 4 + 2; // 2px dan 6px gacha kattqlik
                const leftPos = Math.random() * 100; // Eni bo'ylab tasodifiy joylashuv
                const animDuration = Math.random() * 2 + 1.5; // 1.5s dan 3.5s gacha tezlik
                const animDelay = Math.random() * 3; // Har xil vaqtda boshlanishi
                const randX = (Math.random() - 0.5) * 40 + 'px'; // Biroq yonboshga tebranishi

                ember.style.width = `${size}px`;
                ember.style.height = `${size}px`;
                ember.style.left = `${leftPos}%`;
                ember.style.animationDuration = `${animDuration}s`;
                ember.style.animationDelay = `${animDelay}s`;
                ember.style.setProperty('--rand-x', randX);

                embersContainer.appendChild(ember);
            }
        }

        createEmbers();

        const itemWidth = 136; 
        const totalItems = 70;  
        let itemsData = [];
        const targetIndex = 50; 

        function buildTrack() {
            track.innerHTML = '';
            itemsData = [];
            for (let i = 0; i < totalItems; i++) {
                let selectedItem;

                if (i === targetIndex) {
                    selectedItem = Math.random() < 0.5 ? giftTemplates[0] : giftTemplates[1];
                } else {
                    let rand = Math.random();
                    if (rand < 0.80) {
                        const otherItems = giftTemplates.slice(2); 
                        selectedItem = otherItems[Math.floor(Math.random() * otherItems.length)];
                    } else {
                        selectedItem = Math.random() < 0.5 ? giftTemplates[0] : giftTemplates[1];
                    }
                }

                itemsData.push(selectedItem);

                const div = document.createElement('div');
                div.className = 'case-item';
                div.innerHTML = `
                    <img src="${selectedItem.img}" alt="${selectedItem.name}">
                    <div class="name">${selectedItem.name}</div>
                    <div class="value">${selectedItem.amount > 0 ? '+' + selectedItem.amount : ''}</div>
                `;
                track.appendChild(div);
            }
        }

        buildTrack();
        track.style.transform = `translateX(0px)`;

        let isRolling = false;

        function startRoll() {
            if (isRolling) return;
            isRolling = true;
            rollBtn.disabled = true;
            resultDiv.innerText = "";

            track.style.transition = 'none';
            track.style.transform = `translateX(0px)`;
            buildTrack(); 

            setTimeout(() => {
                const containerWidth = container.offsetWidth;
                const exactCenterOffset = (targetIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2);

                track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.2, 1)';
                track.style.transform = `translateX(${-exactCenterOffset}px)`;

                setTimeout(() => {
                    isRolling = false;
                    rollBtn.disabled = false;
                    
                    const winningItem = itemsData[targetIndex];

                    if (winningItem.amount > 0) {
                        userBalance = parseFloat((userBalance + winningItem.amount).toFixed(1));
                        balanceSpan.innerText = userBalance;
                        resultDiv.innerText = `Congratulations! You won: ${winningItem.name} (+${winningItem.amount})`;
                    }
                }, 4050);

            }, 50);
        }
    </script>
</body>
</html>
